[project]
name = "goethals-seidel-challenge"
version = "0.1.0"
description = "Exactly verified circulant Goethals–Seidel quadruples and evidence"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "numpy>=2,<3", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-include = ["tools/gs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
